name: syrinx
version: 1.1.0
manifest_version: 2
api_version: 1
description: "Your agent is fast. Syrinx makes it wait for the right moment: it parks questions with the default taken while you are heads-down, hands them back in one card with a report counted by code, never asks a settled question again, and turns late-night requests into a morning brief."
author: cstljuan
license: MIT
homepage: https://github.com/cstljuan/syrinx
tags: [focus, attention, interruptions, clarify, standing-answers, catch-up, trust, pet]
requires_hermes: ">=0.23.0"
provides_tools:
  - syrinx_park
  - syrinx_interrupt
  - syrinx_status
  - syrinx_flow
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_human_input_request
  - on_human_input_resolved
config_schema:
  cutoff:
    type: str
    default: "22:30"
    description: "Local time (HH:MM) after which new requests are queued for the morning brief instead of starting."
  wake:
    type: str
    default: "08:00"
    description: "Local time (HH:MM) when the night ends and the morning brief is delivered."
  focus_minutes:
    type: int
    default: 45
    description: "Length of a focus block started with /flow and no number."
  night_enabled:
    type: bool
    default: true
    description: "Queue late-night requests for the morning. Set false to keep only the focus features."
  auto_focus:
    type: bool
    default: false
    description: "macOS only. Open a focus block on its own when you are active in another app, and end it when a Hermes app is in front again. Reads idle time (ioreg) and the front app's bundle id (lsappinfo); stores neither."
  auto_focus_minutes:
    type: int
    default: 30
    description: "Length of an automatic focus block; it is extended while you stay in another app."
  hold_outward:
    type: bool
    default: true
    description: "During a focus block, stop anything that would leave this machine (git push, publish, send, deploy) before it runs, and offer it back on the return card. Local commands are never held."
  question_budget:
    type: int
    default: 0
    description: "Outside a focus block, the most question cards the agent may show you per hour. Extra questions are parked and come back with your next message. 0 means no limit."
  hermes_apps:
    type: str
    default: ""
    description: "Extra bundle ids (comma separated) that count as 'you are with Hermes', on top of the Hermes Desktop app and common terminals."
