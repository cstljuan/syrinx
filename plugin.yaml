name: kairos
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Your agent is fast. Kairos makes sure it waits for the right moment: it parks non-urgent questions while you are heads-down, hands them back in one pass with a catch-up when you return, queues late-night work into a morning brief, and keeps a receipt of the time it gave back."
author: cstljuan
license: MIT
homepage: https://github.com/cstljuan/kairos
tags: [focus, attention, interruptions, catch-up, curfew, wellbeing]
requires_hermes: ">=0.23.0"
provides_tools:
  - kairos_park
  - kairos_interrupt
  - kairos_status
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_human_input_request
  - on_human_input_resolved
config_schema:
  cutoff:
    type: str
    default: "22:30"
    description: "Local time (HH:MM) after which new requests are queued for the morning brief instead of starting."
  wake:
    type: str
    default: "08:00"
    description: "Local time (HH:MM) when the night ends and the morning brief is delivered."
  focus_minutes:
    type: int
    default: 45
    description: "Length of a focus block started with /focus and no number."
  night_enabled:
    type: bool
    default: true
    description: "Queue late-night requests for the morning. Set false to keep only the focus features."
  auto_focus:
    type: bool
    default: false
    description: "macOS only. Open a focus block on its own when you are active in another app, and end it when a Hermes app is in front again. Reads idle time (ioreg) and the front app's bundle id (lsappinfo); stores neither."
  auto_focus_minutes:
    type: int
    default: 30
    description: "Length of an automatic focus block; it is extended while you stay in another app."
  hermes_apps:
    type: str
    default: ""
    description: "Extra bundle ids (comma separated) that count as 'you are with Hermes', on top of the Hermes Desktop app and common terminals."
